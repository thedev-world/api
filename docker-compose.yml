services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devplanet
      POSTGRES_PASSWORD: devplanet
      POSTGRES_DB: devplanet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devplanet -d devplanet"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devplanet-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - devplanet-network

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: devplanet
      MINIO_ROOT_PASSWORD: devplanet
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devplanet-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - devplanet-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app worker --loglevel=info
    networks:
      - devplanet-network

networks:
  devplanet-network:
    external: true

volumes:
  postgres_data:
  minio_data:
