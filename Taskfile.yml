version: "3"

vars:
  COMPOSE: docker compose
  SERVICE_API: api

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  test:
    desc: >
      Pytest in the API container. Pass pytest args after --, e.g.
      task test -- tests/routers/test_health.py::test_health_returns_ok_when_database_check_succeeds
      or task test -- tests/services/test_health_service.py -vv
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps {{.SERVICE_API}} pytest {{.CLI_ARGS}}'

  format:
    desc: Ruff format in the API container (app, alembic, tests)
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps {{.SERVICE_API}} ruff format app alembic tests'

  lint:
    desc: Ruff check in the API container
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps {{.SERVICE_API}} ruff check app alembic tests'

  lint:fix:
    desc: Ruff check --fix in the API container
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps {{.SERVICE_API}} ruff check --fix app alembic tests'

  build:
    desc: Build images
    cmds:
      - "{{.COMPOSE}} build"

  dev:
    desc: Start all services, create MinIO bucket, then follow logs
    cmds:
      - docker network inspect devplanet-network >/dev/null 2>&1 || docker network create devplanet-network
      - "{{.COMPOSE}} up -d"
      - task: minio:setup
      - "{{.COMPOSE}} logs -f"

  minio:setup:
    desc: Create the MinIO bucket and set public-read policy (safe to re-run)
    cmds:
      - "{{.COMPOSE}} exec minio mc alias set local http://localhost:9000 devplanet devplanet"
      - "{{.COMPOSE}} exec minio mc mb --ignore-existing local/devplanet"
      - "{{.COMPOSE}} exec minio mc anonymous set download local/devplanet"

  down:
    desc: Stop containers
    cmds:
      - "{{.COMPOSE}} down"

  migrate-create:
    desc: "Alembic autogenerate (optional MSG=...)"
    vars:
      MESSAGE: '{{.MSG | default "migration"}}'
    cmds:
      - '{{.COMPOSE}} run --rm {{.SERVICE_API}} alembic revision --autogenerate -m "{{.MESSAGE}}"'

  migrate-up:
    desc: Alembic upgrade head
    cmds:
      - "{{.COMPOSE}} run --rm {{.SERVICE_API}} alembic upgrade head"

  migrate-down:
    desc: Alembic downgrade one revision
    cmds:
      - "{{.COMPOSE}} run --rm {{.SERVICE_API}} alembic downgrade -1"

  shell:
    desc: >
      Bash shell in /app with dev deps.
      Supports tab-completion and history.
    cmds:
      - '{{.COMPOSE}} run --rm -it --no-deps {{.SERVICE_API}} bash'

  shell:python:
    desc: Plain Python REPL (>>>).
    cmds:
      - '{{.COMPOSE}} run --rm -it --no-deps {{.SERVICE_API}} python'

  seed:
    desc: "Seed fake developers (--count N, --clear). E.g.: task seed -- --count 1000 --clear"
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps {{.SERVICE_API}} python scripts/seed_fake_developers.py {{.CLI_ARGS}}'

  shell:ipython:
    desc: Same env as shell, with IPython.
    cmds:
      - '{{.COMPOSE}} run --rm -it --no-deps {{.SERVICE_API}} python -m IPython'
